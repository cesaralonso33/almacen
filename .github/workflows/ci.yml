name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      OPENSSL_NO_ASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Pruebas del servidor
        run: cargo test --manifest-path server/Cargo.toml

  escritorio:
    runs-on: windows-latest
    env:
      OPENSSL_NO_ASM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Asegurar Strawberry Perl en PATH
        shell: pwsh
        run: |
          $perl = "C:\Strawberry\perl\bin"
          if (-not (Test-Path $perl)) { choco install strawberryperl -y --no-progress }
          $perl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Dependencias
        working-directory: desktop
        run: npm ci
      - name: Auditoría de dependencias de producción
        working-directory: desktop
        run: npm audit --omit=dev
      - name: Svelte
        working-directory: desktop
        run: npm run check
      - name: Pruebas del escritorio (frontend)
        working-directory: desktop
        run: npm test
      - name: Pruebas del escritorio (Rust)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
