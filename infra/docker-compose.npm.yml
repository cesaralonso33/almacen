name: expedientes

# Variante que reemplaza Caddy por Nginx Proxy Manager dentro del mismo stack.
# Conserva PostgreSQL, la API y el volumen pgdata. NPM administra 80/443 y su
# interfaz queda solo en loopback (127.0.0.1:81) para acceder por túnel SSH.
#
# Antes de desplegar:
#   docker compose -f docker-compose.yml build api
#
# En Portainer: actualice el stack `expedientes` con este Compose y las mismas
# variables POSTGRES_PASSWORD, JWT_SECRET y API_IMAGE. No cree un stack nuevo
# con otro nombre: perdería la red y el volumen de PostgreSQL existentes.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expedientes}
      POSTGRES_USER: ${POSTGRES_USER:-expedientes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *logging
    networks:
      - interna

  api:
    image: ${API_IMAGE:-expedientes-api:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expedientes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expedientes}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ACCESS_TTL_MINUTOS: ${ACCESS_TTL_MINUTOS:-1080}
      REFRESH_TTL_MINUTOS: ${REFRESH_TTL_MINUTOS:-1080}
      IDLE_TTL_MINUTOS: ${IDLE_TTL_MINUTOS:-30}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-30}
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - interna

  npm:
    image: jc21/nginx-proxy-manager:2.17.0
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging
    networks:
      - interna

volumes:
  pgdata:
  npm_data:
  npm_letsencrypt:

networks:
  interna:
    driver: bridge
