name: expedientes

# Stack para Portainer: usa una imagen de API ya construida y rutas ABSOLUTAS
# del host para Caddy. Los stacks Git de Portainer clonan el repositorio dentro
# del contenedor de Portainer, por lo que los montajes relativos (`./Caddyfile`,
# `./certs`) no son fiables: el demonio Docker los resuelve en el host.
#
# Antes de desplegar, desde esta carpeta:
#   docker compose -f docker-compose.yml build api
#   ./preparar-vps.sh --portainer --sitio <dominio>
#
# El script genera portainer.env con API_IMAGE, CADDYFILE y CERTS_DIR absolutos.
# En Portainer: Compose path = infra/docker-compose.portainer.yml.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expedientes}
      POSTGRES_USER: ${POSTGRES_USER:-expedientes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en Portainer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *logging
    networks:
      - interna

  api:
    image: ${API_IMAGE:?Defina API_IMAGE (por ejemplo expedientes-api:local)}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expedientes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expedientes}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en Portainer}
      ACCESS_TTL_MINUTOS: ${ACCESS_TTL_MINUTOS:-1080}
      REFRESH_TTL_MINUTOS: ${REFRESH_TTL_MINUTOS:-1080}
      IDLE_TTL_MINUTOS: ${IDLE_TTL_MINUTOS:-30}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-30}
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
    environment:
      SITIO: ${SITIO:?Defina SITIO en Portainer}
    volumes:
      - ${CADDYFILE:?Defina la ruta absoluta del Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CERTS_DIR:?Defina la ruta absoluta de certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - interna

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
