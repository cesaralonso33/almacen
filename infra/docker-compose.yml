name: expedientes

# Red institucional: solo Caddy publica puertos. PostgreSQL y la API quedan en la red
# interna de contenedores y nunca se exponen al host ni a la LAN.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expedientes}
      POSTGRES_USER: ${POSTGRES_USER:-expedientes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - interna

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expedientes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expedientes}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en infra/.env}
      ACCESS_TTL_MINUTOS: ${ACCESS_TTL_MINUTOS:-15}
      REFRESH_TTL_MINUTOS: ${REFRESH_TTL_MINUTOS:-10080}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-30}
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITIO: ${SITIO:?Defina SITIO en infra/.env}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interna

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
