name: expedientes

# Red institucional: solo Caddy publica puertos. PostgreSQL y la API quedan en la red
# interna de contenedores y nunca se exponen al host ni a la LAN.
#
# Uso local/CLI: construye la imagen de la API desde ../server.
# Para Portainer use `docker-compose.portainer.yml` con una imagen ya construida
# y rutas absolutas del host; los stacks Git de Portainer no resuelven de forma
# fiable los montajes relativos.
# En Portainer use el nombre de stack `expedientes` para que los comandos
# `docker compose` de esta carpeta operen sobre los mismos contenedores.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expedientes}
      POSTGRES_USER: ${POSTGRES_USER:-expedientes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s
    logging: *logging
    networks:
      - interna

  api:
    image: expedientes-api:local
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-expedientes}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-expedientes}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en infra/.env}
      ACCESS_TTL_MINUTOS: ${ACCESS_TTL_MINUTOS:-1080}
      REFRESH_TTL_MINUTOS: ${REFRESH_TTL_MINUTOS:-1080}
      IDLE_TTL_MINUTOS: ${IDLE_TTL_MINUTOS:-30}
      RESERVA_TTL_MINUTOS: ${RESERVA_TTL_MINUTOS:-30}
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
    environment:
      SITIO: ${SITIO:?Defina SITIO en infra/.env}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ${CERTS_DIR:-./certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - interna

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
